<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Link Garden — Playable Preview</title><style>
:root{--ink:#344639;--paper:#fff9eb;--green:#47794c;--line:#c8b694}*{box-sizing:border-box}body{margin:0;min-height:100dvh;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 4%,#f8d5d0 0,transparent 27%),radial-gradient(circle at 88% 8%,#e4efc9 0,transparent 30%),linear-gradient(145deg,#edf3db,#fff6e6 55%,#f3e6cd)}button{font:inherit;cursor:pointer}main{max-width:486px;margin:auto;padding:env(safe-area-inset-top) 13px env(safe-area-inset-bottom);min-height:100dvh;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 5px 4px}.brand{font-family:Georgia,serif;font-weight:700;font-size:26px;color:#3e7450;line-height:1}.sub{font-size:11px;color:#758677;margin-top:3px;letter-spacing:.1em;text-transform:uppercase}.pill{border:1px solid #c7d8b6;background:#ffffffb8;color:#466e4b;border-radius:99px;padding:9px 14px;min-height:46px;font-size:14px;font-weight:700}.heading{text-align:center;margin:17px 0 10px}.heading h1{font:700 23px Georgia,serif;margin:0 0 6px}.heading p{margin:0;font-size:13px;color:#738373}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:0 4px 13px}.stat{border:1px solid #e7dbbf;background:#fffcf1bc;border-radius:13px;text-align:center;padding:9px 0}.stat b{font-size:18px;color:#477249;display:block}.stat small{color:#7f8c7e;font-size:11px}.boardWrap{margin:auto 0;background:linear-gradient(140deg,#b77f54,#936343);box-shadow:0 8px 22px #6a583c22,inset 0 0 0 3px #d6a778;border-radius:19px;padding:12px 11px;position:relative}.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;touch-action:manipulation}.tile{padding:0;min-width:0;aspect-ratio:1;border-radius:11px;border:1px solid #eadbbd;box-shadow:inset 0 -3px #ddcdb3,0 1px 2px #7b593e33;background:linear-gradient(#fffff8,#f6ecd8);display:grid;place-items:center;font-size:clamp(26px,8vw,41px);line-height:1;transition:transform .12s,background .12s}.tile:focus-visible{outline:3px solid #3c99b2;outline-offset:-2px}.tile.chosen{background:#d1f6ed;border-color:#58aeb8;transform:scale(.95)}.tile.hint{background:#f9eaad;border-color:#d7ad40}.tile.empty{background:#b6875d66;border:1px solid #9c6d48aa;box-shadow:inset 0 2px 4px #6f533b24;pointer-events:none}.stroke{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}.status{text-align:center;font-weight:600;font-size:13px;min-height:40px;padding:12px 0;color:#53705c}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.action{border:1px solid #ced3ae;min-height:53px;border-radius:13px;background:#fffbed;color:#557153;font-weight:700;font-size:14px}.action:disabled{opacity:.45;cursor:default}.action.primary{background:#518c5b;border-color:#518c5b;color:#fff}.foot{display:flex;justify-content:space-between;align-items:center;color:#829182;font-size:11px;gap:10px;padding:4px 3px 16px}.overlay{position:fixed;inset:0;background:#2032268a;display:none;place-items:center;padding:18px;z-index:4}.overlay.open{display:grid}.modal{width:min(100%,380px);background:#fff9ea;border-radius:22px;padding:25px;text-align:center;box-shadow:0 20px 80px #19291a44}.modal h2{font:700 25px Georgia,serif;margin:8px 0}.modal p{font-size:15px;line-height:1.55;color:#5b725e}.modal button{width:100%;min-height:53px;margin-top:10px;border:0;border-radius:13px;background:#4e8a57;color:white;font-weight:750}.modal button.secondary{background:#eceddf;color:#44634c}.hidden{display:none!important}
@media(max-height:730px){.heading{margin:7px 0}.stats{margin-bottom:7px}.boardWrap{padding:8px}.board{gap:3px}.status{padding:5px 0}.foot{padding-bottom:3px}.top{padding-top:5px}}
@media(min-width:500px){main{padding-left:26px;padding-right:26px}.tile{font-size:40px}}
</style></head><body><main><div class="top"><div><div class="brand">Link Garden <span aria-hidden="true">❀</span></div><div class="sub">Nối thú · Bản chơi thử</div></div><button class="pill" id="pause">☰ Tạm dừng</button></div><div class="heading"><h1>Nối hai hình giống nhau</h1><p>Đường nối không quá 2 lần rẽ · Không giới hạn giờ</p></div><div class="stats"><div class="stat"><b id="rung">1</b><small>Nấc hiện tại</small></div><div class="stat"><b id="score">0</b><small>Điểm</small></div><div class="stat"><b id="pairs">24</b><small>Cặp còn lại</small></div></div><section class="boardWrap" id="bw"><div class="board" id="board" role="group" aria-label="Bàn Nối thú gồm 6 cột 8 hàng"></div><svg class="stroke" id="route"></svg></section><div class="status" id="status" role="status">Chạm một hình, rồi chạm hình giống nó.</div><div class="buttons"><button class="action" id="undo">↶ Đi lại</button><button class="action" id="hint">✦ Gợi ý</button><button class="action" id="shuffle">⤨ Đảo hình</button></div><div class="foot"><span>◉ Tự lưu sau mỗi nước</span><span>Demo offline · Chưa có Top online</span></div></main><div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="modal"><div style="font-size:40px" id="modalIcon">🌷</div><h2 id="modalTitle">Tạm dừng</h2><p id="modalText">Bạn có thể trở lại bất cứ lúc nào.</p><button id="modalMain">Tiếp tục</button><button class="secondary" id="modalAlt">Chơi lại màn này</button></div></div><script>
// Standalone UX vertical slice, not certified difficulty generator or real ranked service.
const W=6,H=8,KEY='newgame-link-playable-v0';const ICONS=['🌷','🍋','🍓','🦋','🐞','🍄','🌻','🍎','🍐','🐝','🍀','🌸'];
function rand(v){let x=(v>>>0)||0x6d2b79f5;x^=x<<13;x^=x>>>17;x^=x<<5;return x>>>0}
function shuffle(a,seed){const b=a.slice();let x=seed>>>0;for(let i=b.length-1;i>0;i--){x=rand(x);let j=x%(i+1);[b[i],b[j]]=[b[j],b[i]]}return{items:b,seed:x}}
function generate(seed){let types=[];for(let i=0;i<24;i++)types.push(ICONS[i%ICONS.length]);let a=shuffle(types,seed),b=new Array(48);for(let i=0;i<24;i++){let k=Math.floor(i/3)*6+i%3*2;b[k]=b[k+1]=a.items[i]}return{board:b,seed:a.seed}}
function pathOf(board,start,end){if(start===end||start<0||end<0||start>=48||end>=48||!board[start]||board[start]!==board[end])return null;let dirs=[[-1,0],[0,-1],[0,1],[1,0]],seen=new Map(),startR=Math.floor(start/W),startC=start%W,endR=Math.floor(end/W),endC=end%W,q=[{r:startR,c:startC,d:-1,t:0,n:0,path:[[startR,startC]]}];let budget=0;while(q.length){q.sort((a,b)=>a.t-b.t||a.n-b.n||a.r-b.r||a.c-b.c||a.d-b.d);let x=q.shift();if(x.r===endR&&x.c===endC&&x.n)return x;for(let d=0;d<4;d++){let r=x.r+dirs[d][0],c=x.c+dirs[d][1],t=x.t+(x.d===-1||x.d===d?0:1);if(r< -1||c< -1||r>H||c>W||t>2)continue;if(r>=0&&r<H&&c>=0&&c<W&&board[r*W+c]!=null&&r*W+c!==end)continue;let code=`${r},${c},${d},${t}`;if(seen.has(code)&&seen.get(code)<=x.n+1)continue;seen.set(code,x.n+1);q.push({r,c,d,t,n:x.n+1,path:[...x.path,[r,c]]})}if(++budget>12000)throw new Error('Path bound')}return null}
function findPair(board){for(let a=0;a<48;a++)if(board[a]!=null)for(let b=a+1;b<48;b++)if(board[a]===board[b]){let p=pathOf(board,a,b);if(p)return{a,b,p}}return null}
function makeState(seed){const g=generate(seed);return{board:g.board,seed:g.seed,boardStartSeed:seed,boardStartScore:0,score:0,rung:1,turn:0,selected:null,hint:[],undo:[],complete:false}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.board?.length===48&&Number.isInteger(x.score)&&Number.isInteger(x.seed))return {...x,selected:null,hint:[]}}catch{}return makeState(973241)}
let state=load();function save(){try{localStorage.setItem(KEY,JSON.stringify({...state,selected:null,hint:[]}));document.querySelector('.foot span').textContent='◉ Đã tự lưu'}catch{document.querySelector('.foot span').textContent='⚠ Không thể lưu trên máy này'}}
function message(x){document.getElementById('status').textContent=x}function setButtons(){document.getElementById('undo').disabled=state.undo.length===0;document.getElementById('shuffle').disabled=state.complete;document.getElementById('hint').disabled=state.complete}
function draw(){const board=document.getElementById('board');board.replaceChildren();for(let i=0;i<48;i++){let b=document.createElement('button');b.className='tile'+(state.board[i]==null?' empty':'')+(state.selected===i?' chosen':'')+(state.hint.includes(i)?' hint':'');b.textContent=state.board[i]??'';b.disabled=state.board[i]==null;b.setAttribute('aria-label',state.board[i]==null?'Ô trống':`Hình ${state.board[i]}, hàng ${Math.floor(i/6)+1} cột ${i%6+1}`);b.onclick=()=>pick(i);board.appendChild(b)}document.getElementById('score').textContent=state.score.toLocaleString('vi-VN');document.getElementById('rung').textContent=state.rung;document.getElementById('pairs').textContent=state.board.filter(Boolean).length/2;setButtons()}
function pointOn(r,c){const tiles=document.querySelectorAll('.tile');let b=document.getElementById('bw').getBoundingClientRect();const rr=Math.min(H-1,Math.max(0,r)),cc=Math.min(W-1,Math.max(0,c));let rect=tiles[rr*W+cc].getBoundingClientRect();return[(rect.left+rect.width/2-b.left)+(c<0?-rect.width-4:c>=W?rect.width+4:0),(rect.top+rect.height/2-b.top)+(r<0?-rect.height-4:r>=H?rect.height+4:0)]}
function showPath(p){const svg=document.getElementById('route'),bw=document.getElementById('bw');let pts=p.path.map(([r,c])=>pointOn(r,c)).map(([x,y])=>`${x},${y}`).join(' ');svg.innerHTML=`<polyline points="${pts}" fill="none" stroke="#3bbed1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`;setTimeout(()=>svg.replaceChildren(),260)}
function snapshot(){state.undo.push({board:state.board.slice(),score:state.score,turn:state.turn,seed:state.seed});if(state.undo.length>30)state.undo.shift()}
function pick(i){if(state.complete)return;state.hint=[];if(state.selected==null){state.selected=i;draw();message('Chọn hình thứ hai giống hình đang sáng.');return}if(state.selected===i){state.selected=null;draw();return}let a=state.selected,p=pathOf(state.board,a,i);state.selected=null;if(!p){message('Hai hình này chưa nối được. Bạn thử cặp khác nhé.');draw();return}showPath(p);snapshot();state.board[a]=state.board[i]=null;state.score+=100+(2-p.t)*10;state.turn++;draw();save();if(!state.board.some(Boolean)){state.complete=true;save();showModal('🌷','Hoàn thành!','Bạn đã dọn hết bàn. Lên nấc tiếp theo khi bạn muốn.','Chơi màn tiếp theo','Nghỉ ở đây',()=>next(),()=>hideModal())}else message(`Ghép thành công! +${100+(2-p.t)*10} điểm`)}
function hint(){const x=findPair(state.board);if(x){state.hint=[x.a,x.b];draw();message('Hai ô màu vàng có thể nối với nhau.')}else message('Không còn cặp nối. Bạn có thể đảo hình hoặc đi lại.')}
function undo(){if(!state.undo.length)return;let x=state.undo.pop();Object.assign(state,x,{selected:null,hint:[],complete:false});draw();save();message('Đã đi lại một nước. Không mất điểm vì suy nghĩ chậm.')}
function rebuild(){const counts=new Map();for(const icon of state.board)if(icon!=null)counts.set(icon,(counts.get(icon)||0)+1);const icons=[];for(const [icon,num] of counts){if(num%2!==0)return null;for(let i=0;i<num/2;i++)icons.push(icon)}const a=shuffle(icons,state.seed);const board=new Array(48).fill(null);for(let i=0;i<a.items.length;i++){const k=Math.floor(i/3)*6+(i%3)*2;board[k]=board[k+1]=a.items[i]}return{board,seed:a.seed}}
function reshuffle(){if(state.complete)return;const b=rebuild();if(!b){message('Chưa đảo được bàn này. Bạn có thể dùng Đi lại.');return}snapshot();state.board=b.board;state.seed=b.seed;state.turn++;state.hint=[];state.selected=null;draw();save();message('Đã đảo hình. Bàn vẫn có lời giải.')}
function next(){if(!state.complete)return;const g=generate(state.seed);state.boardStartSeed=state.seed;state.boardStartScore=state.score;state.board=g.board;state.seed=g.seed;state.rung++;state.turn=0;state.undo=[];state.selected=null;state.hint=[];state.complete=false;draw();save();hideModal();message('Nấc mới. Bạn cứ chơi thong thả nhé!')}
const overlay=document.getElementById('overlay');let mainFn,altFn;function showModal(icon,title,txt,main,alt,onMain,onAlt){document.getElementById('modalIcon').textContent=icon;document.getElementById('modalTitle').textContent=title;document.getElementById('modalText').textContent=txt;document.getElementById('modalMain').textContent=main;document.getElementById('modalAlt').textContent=alt;mainFn=onMain;altFn=onAlt;overlay.classList.add('open')}function hideModal(){overlay.classList.remove('open')}
document.getElementById('modalMain').onclick=()=>mainFn?.();document.getElementById('modalAlt').onclick=()=>altFn?.();document.getElementById('hint').onclick=hint;document.getElementById('undo').onclick=undo;document.getElementById('shuffle').onclick=reshuffle;document.getElementById('pause').onclick=()=>showModal('☕','Nghỉ một chút','Bàn cờ của bạn đã được lưu. Bạn có thể quay lại tối nay hoặc ngày mai.','Tiếp tục','Chơi lại màn này',hideModal,()=>{const g=generate(state.boardStartSeed ?? state.seed);state.board=g.board;state.seed=g.seed;state.score=state.boardStartScore ?? 0;state.turn=0;state.undo=[];state.complete=false;state.selected=null;state.hint=[];draw();save();hideModal();message('Đã bắt đầu lại bàn này.')});window.addEventListener('pagehide',save);window.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save()});draw();if(state.board.every(x=>x==null)){state.complete=true;showModal('🌷','Bàn đã hoàn thành','Bạn có thể tiếp tục nấc tiếp theo.','Chơi tiếp','Nghỉ ở đây',next,hideModal)}
</script></body></html>

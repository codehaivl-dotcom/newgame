name: Prototype QA
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check production manifest and deterministic game engines
        run: npm run check
      - name: Check Link rank simulation across 30 seeded boards
        run: npm run simulate:link
